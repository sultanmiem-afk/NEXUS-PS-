name: NEXUS PS CPU tests

on:
  push:
    paths:
      - "engine/ps1/**"
      - ".github/workflows/cpu-tests.yml"
  pull_request:
    paths:
      - "engine/ps1/**"
      - ".github/workflows/cpu-tests.yml"
  workflow_dispatch:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S engine/ps1 -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
